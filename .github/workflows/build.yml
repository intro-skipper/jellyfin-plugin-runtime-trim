name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - uses: actions/upload-artifact@v6
        with:
          name: Jellyfin.Plugin.RuntimeTrim
          path: Jellyfin.Plugin.RuntimeTrim/bin/Release/net10.0/Jellyfin.Plugin.RuntimeTrim.dll
          if-no-files-found: error
