name: Release

# Publishes the version and changelog in build.yaml as release v<version>, so bump both first.
# The intro-skipper manifest picks up new releases once a day.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read version
        run: echo "VERSION=$(yq '.version' build.yaml)" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j "runtime-trim-v$VERSION.zip" Jellyfin.Plugin.RuntimeTrim/bin/Release/net10.0/Jellyfin.Plugin.RuntimeTrim.dll
          gh release create "v$VERSION" "runtime-trim-v$VERSION.zip" \
            --notes "$(yq '.changelog' build.yaml)" \
            --target "$GITHUB_SHA"
