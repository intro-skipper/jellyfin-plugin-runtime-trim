owner: "intro-skipper"
imageUrl: "https://raw.githubusercontent.com/intro-skipper/jellyfin-plugin-runtime-trim/main/images/icon.png"
overview: "Ends playback when the video ends, even if an audio track runs longer"
description: >
  Some releases mux an audio track that runs past the end of the video, so playback continues on
  a frozen frame until the longest track ends. Runtime Trim sets the runtime to where the video
  stream ends.
category: "General"

# Newtonsoft.Json ships with the server, so only the plugin's own DLL is packaged.
